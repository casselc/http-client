name: tests
on: [push, pull_request]
# Two pinned jolts, not whatever the latest release happens to be, because this
# library takes a DIFFERENT CODE PATH on each and both ship to users.
#
#   floor  - the oldest jolt supported. jolt.http.net binds fcntl through the
#            :varargs marker, which landed in 0.6.8; an unpinned install picked
#            up 0.6.7 and the whole suite died at namespace load with "unknown
#            foreign type :varargs". Raise this when a namespace starts using a
#            newer jolt feature.
#   host   - a jolt whose own java.io byte streams answer the full surface
#            (readNBytes/transferTo/mark landed in 0.7.19). There
#            jolt.http.platform stops registering its shims over
#            ByteArrayInputStream/ByteArrayOutputStream and hands back jolt's
#            classes instead. Testing only the floor left that path — the one
#            most users are now on — never exercised.
#
# Raise `host` as new jolt releases land; keep `floor` until the floor moves.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jolt: '0.6.8'
            path: floor (shim byte streams)
          - jolt: '0.7.19'
            path: host byte streams
    name: test (jolt ${{ matrix.jolt }} - ${{ matrix.path }})
    env:
      JOLT_VERSION: ${{ matrix.jolt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libssl3
          # Install through jolt's own install script rather than resolving the
          # release asset here: it owns the archive and binary naming (which
          # changed in v0.5.0, when the CLI was renamed from joltc to jolt) and
          # verifies the checksum. Resolving the asset by hand left this workflow
          # chmod'ing a $HOME/.jolt/joltc that no release ships any more.
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt" --version "$JOLT_VERSION"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
