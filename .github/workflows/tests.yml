name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  # One reviewed fork revision for every source-mode lane. The pinned jolt-net
  # (reached through jolt-tcp) needs host/FFI primitives a released joltc does
  # not carry, so every lane below builds against this core rather than a
  # published artifact. Keep it centralized so no platform can silently
  # validate against a different core.
  JOLT_CORE_SHA: 46e1f74fc14f29283586900ef4b98c45375c0500
  CHEZ_TOOLCHAIN_RELEASE: chez-ci-10.4.1.1

jobs:
  # ---------------------------------------------------------------------------
  # POSIX: the full surface, including the capabilities that are POSIX-only
  # today. This is the lane that keeps OpenSSL TLS and libz compression honest.
  # It is deliberately NOT the lane backing the cross-platform plaintext claim.
  # ---------------------------------------------------------------------------
  posix:
    name: POSIX suite (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            arch: x86-64
            chez-target: linux-x86_64
            chez-sha256: 16476cd98fb5cb2e2c0285e88fcd6d57ade9392ca8d7cf603ca38432b4118526
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            chez-target: linux-aarch64
            chez-sha256: b5b2306d3d6468b5fc7d5836721b09c704c7750f887a6232f1aeeb567d55f5d9
          - name: macOS arm64
            runner: macos-15
            arch: aarch64
            chez-target: macos-arm64
            chez-sha256: d5b5a504eed1e0f117b4a3dd23ad0030bb3e5c0da6d6b9d9f990f5f2fa32478f
          - name: macOS x86_64
            runner: macos-15-intel
            arch: x86-64
            chez-target: macos-x86_64
            chez-sha256: e4577ad71b1f1e1062c361fa612af60d75378e64dc2869d8c8eefd3d7efdbc62
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The immutable archives contain Chez and its source-runtime headers.
      # These are only the libraries exercised by this repository plus the
      # archive extractor; Chez itself is never built from source here.
      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev z3 zstd

      - name: Install runtime dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 z3 zstd

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@1c3067ae6db81d412339cadc0f6d8261f29a91a6
        with:
          target: ${{ matrix.chez-target }}
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: ${{ matrix.chez-sha256 }}
          capabilities: source-runtime

      # The action verifies the pinned digest, packaged inventory, version, and
      # target machine type. There is no source-build fallback: corrupted,
      # republished, or wrongly targeted archives fail the lane closed.
      - name: Provide and assert official Chez v10.4.1
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JOLT_CHEZ"
          "$JOLT_CHEZ" --version > "$RUNNER_TEMP/chez-version" 2>&1
          cat "$RUNNER_TEMP/chez-version"
          grep -Fq '10.4.1' "$RUNNER_TEMP/chez-version"

      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      # clj-http-lite's own client/links/integration suites, plus the transport
      # boundary and OpenSSL TLS tests. TLS and gzip are exercised here.
      - name: clj-http-lite compatibility suite (TLS + compression)
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:test

      - name: libz round-trip
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:zlibtest

      - name: babashka.http-client compatibility surface
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:bhctest

      - name: Capability seam (present and forced-absent providers)
        shell: bash
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:capability

      # The same gate the Windows lanes run, so a divergence between platforms
      # shows up as one suite disagreeing rather than as two different suites.
      - name: Plaintext loopback gate
        shell: bash
        env:
          JOLT_EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          JOLT_PWD="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/jolt/bin/jolt" -M:plaintext-test

      - name: Schannel bounded proof models
        run: tools/verify-models.sh

  # ---------------------------------------------------------------------------
  # Native Windows: the claim this slice exists to make. Plaintext HTTP through
  # the unchanged clj-http-lite API, over jolt-tcp, against a real loopback
  # origin, on a platform carrying neither OpenSSL nor zlib. Windows HTTPS uses
  # its native Schannel provider, but the plaintext gate still fails if any
  # provider namespace is loaded during that run, so it cannot quietly become a
  # TLS-shaped test that happens to pass.
  #
  # Source-runtime evidence only: official native Chez 10.4.1, AOT disabled, no
  # packaged joltc.
  # ---------------------------------------------------------------------------
  windows-plaintext:
    name: Plaintext loopback (Windows x86_64)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/aot-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Probe native Schannel ABI and default client credentials
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\tools\probe-schannel.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -ExpectedArch 'x86-64'

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@1c3067ae6db81d412339cadc0f6d8261f29a91a6
        with:
          target: windows-x86_64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 360c60496eea2f8aab0e557eb77e9e18b315bb9181938158ae57655aa541b7f8
          capabilities: source-runtime

      - name: Provide and assert official Chez v10.4.1
        shell: powershell
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          $version = (& $env:CHEZ_EXECUTABLE --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $version
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }

      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      - name: Plaintext loopback gate (real sockets, no TLS or zlib provider)
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:plaintext-test' `
            -TimeoutSeconds 900

      - name: Capability seam
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TestAlias '-M:capability' `
            -TimeoutSeconds 600

      - name: Native Schannel TLS gate
        shell: powershell
        env:
          JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-schannel.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'x86-64' `
            -TimeoutSeconds 600

  # ---------------------------------------------------------------------------
  # Windows ARM64 runs the same gates on a native ARM64 Chez. The
  # JOLT_EXPECTED_ARCH check inside the test main makes an emulated x86-64
  # process fail before any assertion can pass, so a green run here is aarch64
  # evidence rather than emulation.
  # ---------------------------------------------------------------------------
  windows-arm64-plaintext:
    name: Plaintext loopback (Windows aarch64)
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 60
    env:
      JOLT_CACHE_DIR: ${{ github.workspace }}/.jolt/native-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Assert the runner is ARM64
        shell: pwsh
        run: |
          Write-Host "runner.arch      = ${{ runner.arch }}"
          Write-Host "PROCESSOR_ARCH   = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "OS architecture  = $((Get-CimInstance Win32_OperatingSystem).OSArchitecture)"
          if ('${{ runner.arch }}' -ne 'ARM64') {
            throw "expected an ARM64 runner, got '${{ runner.arch }}'"
          }

      - name: Probe native ARM64 Schannel ABI and default client credentials
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tools\probe-schannel.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -ExpectedArch 'aarch64'

      - name: Set up the shared Chez CI toolchain
        id: chez
        uses: casselc/jolt-toolchains/setup-chez@1c3067ae6db81d412339cadc0f6d8261f29a91a6
        with:
          target: windows-arm64
          release-tag: ${{ env.CHEZ_TOOLCHAIN_RELEASE }}
          sha256: 9bc28462823a1447de6d849e129758a6317cc9deafb8e87414817e7244f149c8
          capabilities: source-runtime

      - name: Checkout pinned Jolt core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: casselc/jolt
          ref: ${{ env.JOLT_CORE_SHA }}
          submodules: recursive
          persist-credentials: false
          path: jolt

      - name: Assert native ARM64 Chez v10.4.1
        shell: pwsh
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          $scheme = $env:CHEZ_EXECUTABLE
          if (-not (Test-Path $scheme)) {
            throw "native ARM64 Chez executable not found: $scheme"
          }
          $version = (& $scheme --version 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --version exited $LASTEXITCODE"
          }
          Write-Host "chez version: $version"
          if (-not $version.Contains('10.4.1')) {
            throw "expected Chez Scheme 10.4.1, got: $version"
          }
          $probe = Join-Path $env:RUNNER_TEMP 'machine-type.ss'
          Set-Content -Path $probe -Value '(display (machine-type))(newline)'
          $machine = (& $scheme --script $probe | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "scheme.exe --script exited $LASTEXITCODE"
          }
          Write-Host "machine-type: $machine"
          if ($machine -ne 'tarm64nt') {
            throw "expected a native tarm64nt Chez, got '$machine'"
          }

      - name: Plaintext loopback gate (real sockets, no TLS or zlib provider)
        shell: pwsh
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:plaintext-test' `
            -TimeoutSeconds 900

      - name: Capability seam
        shell: pwsh
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-source.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'aarch64' `
            -TestAlias '-M:capability' `
            -TimeoutSeconds 600

      - name: Native Schannel TLS gate
        shell: pwsh
        env:
          CHEZ_EXECUTABLE: ${{ steps.chez.outputs.executable }}
        run: |
          & "$env:GITHUB_WORKSPACE\tools\test-windows-schannel.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -RuntimePath "$env:GITHUB_WORKSPACE\jolt" `
            -ChezExe "$env:CHEZ_EXECUTABLE" `
            -ExpectedArch 'aarch64' `
            -TimeoutSeconds 600
